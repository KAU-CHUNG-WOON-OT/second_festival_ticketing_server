spring:
  # 로컬 개발: 루트의 .env를 읽는다 (없으면 무시, 배포 환경은 실제 환경변수 사용)
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  application:
    name: archiver
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ticketing}
    username: ${DB_USERNAME:ticketing}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}

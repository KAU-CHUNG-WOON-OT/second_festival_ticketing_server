# PR과 main 반영 시 빌드와 테스트를 실행한다.
# Testcontainers 테스트는 러너에 기본 설치된 Docker를 사용한다.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 캐시와 wrapper 검증
      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            api/build/reports/tests/
            archiver/build/reports/tests/
          retention-days: 7

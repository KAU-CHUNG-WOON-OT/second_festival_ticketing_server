spring:
  # 로컬 개발: 루트의 .env를 읽는다 (없으면 무시, 배포 환경은 실제 환경변수 사용)
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  application:
    name: api
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # 기본값(60초)을 쓰면 Redis 장애 시 요청이 오래 매달리므로 짧게 둔다
      timeout: 500ms

server:
  port: 8080
  tomcat:
    accept-count: 2000
    max-connections: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 인증 서버와 같은 값이어야 토큰을 검증할 수 있다. 시크릿은 32바이트 이상
jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:auth-backend}

# 프론트 도메인. 여러 개면 쉼표로 구분 (예: https://www.chungwoon-festival.com,http://localhost:5173)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Swagger: 로컬에서 http://localhost:8080/swagger-ui.html
# 운영(prod 프로필)에서는 application-prod.yml에서 끈다
springdoc:
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    # 새로고침해도 Authorize에 넣은 토큰이 유지되도록
    persist-authorization: true
